<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Human Typer</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="masthead">
        <div class="brand-row">
          <div class="brand-signature">
            <svg class="brand-mark" viewBox="0 0 28 28" fill="none" aria-hidden="true">
              <rect x="3" y="3" width="22" height="22" rx="7" stroke="currentColor" stroke-width="1.7"/>
              <path d="M8 9h12M14 9v11M10 20h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <h1>Human Typer</h1>
          </div>
          <button id="aboutButton" class="info-button" type="button" aria-label="使用说明" aria-expanded="false" aria-controls="aboutPopover">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6M12 7v1" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
        </div>
        <div id="aboutPopover" class="about-popover" hidden>
          <strong>使用方法</strong>
          <p>选择网页输入位置，填好草稿后点击“开始输入”。</p>
          <p>点击“停止”可中止输入。草稿和设置保存在本机。</p>
        </div>
      </header>

      <main class="workspace">
        <section class="destination" aria-labelledby="destinationHeading">
          <div class="section-heading">
            <div class="section-name"><h2 id="destinationHeading">输入位置</h2></div>
            <span id="targetBadge" class="target-badge">待选择</span>
          </div>
          <button id="targetButton" class="destination-button" type="button" aria-label="选择网页输入位置" aria-describedby="targetStatus">
            <span class="destination-crosshair" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 2v5M12 17v5M2 12h5M17 12h5" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
            </span>
            <span class="destination-copy"><span id="targetTitle">选择网页输入位置</span><span id="targetSubtitle">然后点击网页中的输入位置</span></span>
            <svg class="destination-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
          <p id="targetStatus" class="target-note">点击上方按钮，再点网页中的输入位置。</p>
        </section>

        <section class="draft-section" aria-labelledby="draftHeading">
          <div class="section-heading">
            <div class="section-name"><h2 id="draftHeading"><label for="draft">草稿</label></h2></div>
          </div>
          <div class="paper-sheet">
            <div class="paper-toolbar" aria-label="草稿操作">
              <button id="pasteButton" class="paper-button" type="button">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5H5v15h14V5h-4M9 3h6v4H9zM9 12h6M9 16h4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
                <span>粘贴文字</span>
              </button>
              <button id="clearButton" class="paper-button clear-button" type="button" aria-label="清空草稿">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
                <span>清空</span>
              </button>
            </div>
            <textarea id="draft" placeholder="输入或粘贴要自动输入的文字" spellcheck="false" aria-describedby="draftSaveStatus"></textarea>
            <div class="paper-footer">
              <span id="draftSaveStatus" class="save-status">自动保存到本机</span>
              <span class="character-count"><span id="charCount">0</span><span class="count-unit">字</span></span>
            </div>
          </div>
        </section>

        <section class="rhythm-section" aria-labelledby="rhythmHeading">
          <div class="section-heading">
            <div class="section-name"><h2 id="rhythmHeading">输入设置</h2></div>
          </div>
          <div class="speed-heading">
            <label for="speed">输入速度</label>
            <output id="speedValue" for="speed">约 118 字 / 分钟</output>
          </div>
          <input id="speed" class="speed-slider" type="range" min="0" max="100" value="25" aria-label="输入速度" aria-describedby="speedHint">
          <div id="speedHint" class="speed-scale"><span>慢</span><span class="speed-ticks" aria-hidden="true">│ │ │ │ │ │ │ │ │ │ │</span><span>快</span></div>
          <div class="human-control">
            <div class="human-copy">
              <span class="human-title">模拟人工输入</span>
              <p>随机停顿和错字修正</p>
            </div>
            <button id="humanToggle" class="human-switch" type="button" role="switch" aria-checked="true" aria-label="模拟人工输入">
              <span class="switch-state" aria-hidden="true">开</span><span class="switch-knob"></span>
            </button>
          </div>
        </section>

        <details class="connection-details">
          <summary><span>连接与权限</span><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.7"/></svg></summary>
          <div class="connection-content">
            <p id="connectionInfo">侧栏 v1.5.0 · 正在连接后台…</p>
            <p id="docsPermissionHint" hidden>Google 应用使用浏览器调试输入连接；仅在输入期间连接当前标签页，完成或停止后断开。</p>
            <p>网页光标暂时隐藏是焦点切换造成的，已选择的目标仍会保留。</p>
          </div>
        </details>
      </main>

      <footer class="transport" aria-label="输入控制">
        <div class="transport-meta"><span class="session-state"><span class="session-dot" aria-hidden="true"></span><span id="sessionLabel">准备就绪</span></span><span id="progressLabel">等待开始</span></div>
        <progress id="typingProgress" max="1" value="0" aria-label="输入进度"></progress>
        <div class="transport-buttons">
          <button id="startButton" class="start-button" type="button" disabled>
            <span id="startLabel">开始输入</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path id="startIconPath" d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
          <button id="stopButton" class="stop-button" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7h10v10H7z" stroke="currentColor" stroke-width="1.8"/></svg><span>停止</span>
          </button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true">请先选择网页输入位置。</p>
      </footer>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
